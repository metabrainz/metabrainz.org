[uwsgi]
uid = www-data
gid = www-data
master = true
socket = 0.0.0.0:13050
; HTTP socket for HAProxy internal gateway (haproxy-internal)
http-socket = 0.0.0.0:13052
module = metabrainz:create_oauth_app()
enable-threads = true
chdir = /code/metabrainz
processes = 20
listen = 1024
log-x-forwarded-for=true
disable-logging = true
; default 4096 byte header buffer rejects requests with large cookies/headers
; with "invalid request block size"
buffer-size = 16384
; clients disconnecting mid-response (usually while fetching static assets) are
; normal; do not spam the log with SIGPIPE/broken pipe tracebacks for them
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true
; quit uwsgi if the python app fails to load
need-app = true
die-on-term = true
